[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in LLMs with constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk", editable = true }

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
]
follow_imports = "skip"

